name: 错误报告
description: 提交可复现问题，请移除凭据和个人数据
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "安全漏洞请使用 Security 页的私密报告入口；不要在 Issue 中粘贴 API Key、token、cookie 或未经脱敏的日志。"
  - type: input
    id: version
    attributes:
      label: 应用版本 / versionCode
      description: 请同时提供 APK 版本与构建来源
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Android 版本与设备
      description: 仅填写复现所需的设备型号、系统版本和权限模式
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 使用测试账户与测试数据，提供最小可复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 可选。请先检查日志、截图、录屏中的密钥、用户文件和个人信息
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布检查
      options:
        - label: 我已移除凭据和不必要的个人数据，且有权公开附带素材
          required: true
